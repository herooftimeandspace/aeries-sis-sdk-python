site_name: "Aeries SIS Python SDK"
site_url: "https://example.github.io/aeries-sis-sdk-python/"
repo_url: "https://github.com/example/aeries-sis-sdk-python"
repo_name: "example/aeries-sis-sdk-python"
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
nav:
  - Home: index.md
  - Guides:
      - Architecture: guides/architecture.md
      - Contract Sync: guides/contract-sync.md
      - Testing: guides/testing.md
      - Live Tests: guides/live-tests.md
      - Troubleshooting: guides/troubleshooting.md
  - API Reference: reference.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
strict: true
