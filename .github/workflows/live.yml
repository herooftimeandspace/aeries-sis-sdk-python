name: live

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  live:
    if: ${{ secrets.AERIES_TEST_BASE_URL != '' && secrets.AERIES_TEST_CERT != '' }}
    runs-on: ubuntu-latest
    env:
      AERIES_TEST_BASE_URL: ${{ secrets.AERIES_TEST_BASE_URL }}
      AERIES_TEST_CERT: ${{ secrets.AERIES_TEST_CERT }}
      AERIES_TEST_SCHOOL_CODE: ${{ secrets.AERIES_TEST_SCHOOL_CODE }}
      AERIES_TEST_STUDENT_ID: ${{ secrets.AERIES_TEST_STUDENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: ./.venv/bin/python -m pip install -e '.[dev]'

      - name: Run live tests
        run: make live-test

