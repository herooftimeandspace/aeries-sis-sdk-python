name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: ./.venv/bin/python -m pip install -e '.[dev]'

      - name: Verify the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(./.venv/bin/python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $packaged." >&2
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Docstring coverage
        run: ./.venv/bin/python -m interrogate src

      - name: Build docs
        run: make docs

      - name: Build package
        run: make build

      - name: Dependency audit
        run: make audit

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for the changes in this release." \
            dist/*
